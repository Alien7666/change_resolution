name: Release

# A `v*` tag publishes a release. workflow_dispatch runs everything except the
# publish step, so the pipeline can be rehearsed without creating a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    # The only write this job performs is creating the release and uploading its
    # assets. Every other scope is dropped to none by naming permissions here.
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Test, vet and build the release binary
        # build.ps1 is the single source of truth: go generate (rebuilds the
        # gitignored rsrc.syso from resolution-tray.manifest, so the Common
        # Controls 6 / PerMonitorV2 manifest is never lost) -> go test ./... ->
        # go vet ./... -> the GUI-subsystem exe. It stops at the first failure,
        # so nothing is produced unless the full test suite passed first.
        #
        # RUN_DISPLAY_INTEGRATION is deliberately never set: the opt-in tests in
        # internal/display drive the real Win32 display APIs.
        run: ./build.ps1

      - name: Compute the SHA256 checksum
        id: checksum
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'dist/ResolutionTray.exe'
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "build.ps1 did not produce $exe"
          }
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash.ToLowerInvariant()
          # sha256sum-compatible: two spaces, and an LF terminator so that
          # `sha256sum -c` accepts the file on Linux and macOS too.
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD 'dist/ResolutionTray.exe.sha256'),
            "$sha  ResolutionTray.exe`n")
          "sha256=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "**ResolutionTray.exe SHA256:** $sha"

      - name: Report that a manual run does not publish
        if: github.event_name == 'workflow_dispatch'
        run: |
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value 'Dry run: the binary was built and checksummed, but no release was published. Push a `v*` tag to publish one.'

      - name: Publish the GitHub Release
        # Only a tag push publishes; a manual dry run stops at the step above.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: |
            dist/ResolutionTray.exe
            dist/ResolutionTray.exe.sha256
          # Fail loudly rather than publishing a release with no assets.
          fail_on_unmatched_files: true
          body: |
            **ResolutionTray** — Windows 系統匣工具，讓你選擇目標顯示器、顯示模式與要觀察的程式。啟動與首次設定只讀取狀態；只有明確操作才會套用顯示模式。

            ## 下載

            | 檔案 | 說明 |
            | --- | --- |
            | `ResolutionTray.exe` | Windows x64 執行檔，免安裝 |
            | `ResolutionTray.exe.sha256` | SHA256 校驗碼 |

            ### 校驗

            ```
            ${{ steps.checksum.outputs.sha256 }}  ResolutionTray.exe
            ```

            ```powershell
            (Get-FileHash -Algorithm SHA256 .\ResolutionTray.exe).Hash -eq '${{ steps.checksum.outputs.sha256 }}'
            ```

            請只從可信任的 Release 與來源取得檔案。SHA256 可確認下載內容與本 Release 的附件相符，但不取代來源信任或 Windows 的安全判斷。

            ## 使用前必讀

            - **初次設定** — 選擇目標顯示器、列舉出的模式與可選的觀察程式。取消或「稍後再設定」不會建立設定檔，也不會變更螢幕。
            - **GPU 縮放** — 選用非原生比例時，你可自行決定是否需要全螢幕縮放或保留黑邊。支援的 NVIDIA 系統可用程式內的手動按鈕要求「全螢幕（由 GPU 執行）」；AMD 與 Intel 仍須在各自控制台設定。縮放不會隨模式開關或觀察程式結束而自動寫入。
            - **遊戲覆寫** — 「覆寫遊戲和程式所設定的縮放模式」仍須在 NVIDIA 控制台自行設定；本工具無法讀取或修改它，也無法保證遊戲中的黑邊結果。
            - **安全邊界** — 工具只列舉程式名稱，並使用 Win32 顯示 API 與 NVIDIA NVAPI 處理明確要求的顯示／縮放動作；不啟動、注入、掛勾或讀取被觀察程式，也不使用 `CDS_UPDATEREGISTRY`。顯示模式與 GPU 縮放都是執行期變更。

            完整說明請見 [README](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/README.md)。
